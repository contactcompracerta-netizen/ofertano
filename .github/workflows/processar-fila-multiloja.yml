name: Processar fila Multi Loja

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ofertano-import-queue
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Processar 1 item da fila
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET não configurado no GitHub."
            exit 1
          fi

          curl             --fail-with-body             --silent             --show-error             --max-time 70             --header "Authorization: Bearer $CRON_SECRET"             "https://ofertano.vercel.app/api/cron/import-queue"
